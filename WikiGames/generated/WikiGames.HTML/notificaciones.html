<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WikiGames · Notificaciones</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="notificaciones">
  <header data-navbar></header>

  <main class="container narrow">
    <h1 class="page-title">Notificaciones</h1>

    <div class="toolbar">
      <div class="search">
        <span data-icon="search"></span>
        <input id="q" class="field" type="search" placeholder="Buscar en tus notificaciones…" aria-label="Buscar notificaciones" autocomplete="off">
      </div>
    </div>

    <p id="count" class="result-count" aria-live="polite">1 notificación</p>

    <!-- Lista de notificaciones (muestra representativa única) -->
    <section id="list" class="admin-list" aria-label="Lista de notificaciones">
      <article class="card report-card">
        <div class="report-main">
          <span class="avatar"><span data-icon="flag"></span></span>
          <div>
            <strong>¡Enhorabuena! Tu videojuego "Pixel Jump" ha sido aprobado.</strong>
            <div class="muted">
              <time datetime="2026-11-18T20:15:00">18 nov 2026, 20:15</time> · Sistema WikiGames
            </div>
          </div>
        </div>
        <div class="report-actions">
          <a class="btn btn-sm btn-primary" href="notificacion.html?id=1">Ver detalle</a>
          <button type="button" class="icon-btn" title="Eliminar notificación" aria-label="Eliminar"><span data-icon="trash"></span></button>
        </div>
      </article>
    </section>
  </main>

  <nav data-bottombar></nav>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
</body>
</html>
