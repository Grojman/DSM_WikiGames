<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
        <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header data-navbar></header>
    <main class="container narrow">
        <h1 class="page-title">Crear cuenta</h1>
    <div class="card form-card">
    <form>
        <br><br><input type="text" placeholder="Usuario" class="field">
        <br><br><input type="email" placeholder="Email" class="field">
        <br><br><input type="password" placeholder="Contraseña" class="field" id="ps1"><button type="button" onclick="ver('ps1', 'img1')"><img id="img1" src="iconos/visibility.svg" alt=""></button>
        <br><br><input type="password" placeholder="Repetir contraseña" class="field" id="ps2"><button type="button" onclick="ver('ps2' , 'img2')"><img id="img2" src="iconos/visibility.svg" alt=""></button>
        <br><br><input type="submit">
    </form>
    </div>
    </main>
    <script src="js/common.js"></script>
    <script src="js/data.js"></script>
    <script>
        function ver(id , idimg){
            let ps = document.getElementById(id);
            let img = document.getElementById(idimg);
            if (ps.type == "password") {
                ps.type = "text";
                img.src = "iconos/visibility_off.svg"
            }else{
                ps.type = "password";
                img.src = "iconos/visibility.svg"
            }
        }
    </script>
</body>
</html>
