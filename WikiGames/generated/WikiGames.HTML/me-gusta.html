<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WikiGames · Me gusta</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="favoritos">
  <header data-navbar></header>

  <main class="container">
    <h1 class="page-title">Contenido con Me gusta</h1>

    <!-- Filtro por tipo de contenido -->
    <div class="center">
      <div id="seg" class="seg" role="tablist" aria-label="Filtrar por tipo de contenido">
        <button class="active" type="button">Todos</button>
        <button type="button">Videojuegos</button>
        <button type="button">Conversaciones</button>
        <button type="button">Comentarios</button>
      </div>
    </div>

    <p id="count" class="result-count" aria-live="polite">1 elemento guardado</p>

    <!-- Lista de contenidos marcados (muestra representativa única) -->
    <section id="list" class="admin-list" aria-label="Lista de contenidos con me gusta">
      <article class="card report-card">
        <div class="report-main">
          <span class="target"><span data-icon="heart"></span>Videojuego</span>
          <div>
            <h3 class="thread-title" style="font-size: 1.1em; margin: 0 0 4px;"><a href="videojuego.html?id=10">Starfall Odyssey</a></h3>
            <p class="muted" style="margin: 0;">Exploración espacial con combates por turnos. Creado por <strong>ana</strong> (ana@wikigames.com)</p>
          </div>
        </div>
        <div class="report-actions">
          <a class="btn btn-sm btn-primary" href="videojuego.html?id=10">Ver contenido</a>
          <button type="button" class="btn btn-sm btn-ghost" title="Quitar me gusta"><span data-icon="x"></span>Quitar</button>
        </div>
      </article>
    </section>
  </main>

  <nav data-bottombar></nav>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
</body>
</html>
